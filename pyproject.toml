[project]
name = "cavalry-mcp"
version = "0.1.0"
description = "MCP server for controlling Cavalry, the motion design software"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael" }]
keywords = ["mcp", "cavalry", "motion-design", "animation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.28.0",
]

[project.urls]
Repository = "https://github.com/m18h/cavalry-mcp"
Issues = "https://github.com/m18h/cavalry-mcp/issues"

[project.optional-dependencies]
kb = [
    "fastembed>=0.4.0",
    "markdownify>=0.14.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
cavalry-mcp = "cavalry_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cavalry_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
